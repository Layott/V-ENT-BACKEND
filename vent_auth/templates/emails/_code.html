{% comment %}A code the reader must retype. Big, spaced, selectable.{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td bgcolor="#26262C" align="center" style="background-color:#26262C; border-radius:12px; padding:22px 16px;">
      <div style="font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace; font-size:30px; line-height:36px; font-weight:700; color:#FFFFFF; letter-spacing:7px;">{{ code }}</div>
      {% if note %}<div style="font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; color:#8A8A93; padding-top:10px;">{{ note }}</div>{% endif %}
    </td>
  </tr>
</table>
