# V-ENT nginx site. Copy to /etc/nginx/sites-available/vent and symlink into
# sites-enabled. certbot rewrites the ssl_certificate lines on first run.
#
# This file is the whole front door: TLS, caching, rate limiting and upload
# limits. There is no CDN in front of it (CEO rule: everything on the VPS), so
# the protection Cloudflare would have given has to live here.

limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=api:10m  rate=120r/m;

# The admin console, which is NOT a login form.
#
# `/auth/admin/...` used to fall into the `auth` zone above, because the
# location regex read `^/auth/(login|signup|forgot-password|admin)`. That zone
# is 5 requests a minute, which is right for somebody guessing a password and
# absurd for a console whose dashboard alone fetches metrics, charts and recent
# activity on every page load. The console tripped the limiter within seconds
# of opening, nginx refused everything after that, and because a limiter
# rejection carries no CORS headers the browser reported it to the operator as
# "could not reach the server" rather than as a throttle.
#
# Still limited, because it sits on the open internet: generous enough to work,
# small enough to notice.
limit_req_zone  $binary_remote_addr zone=admin:10m rate=300r/m;

# 429 rather than the default 503. A throttle is the client being asked to slow
# down, not the server being broken, and the two read very differently to
# whoever is looking at it.
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name v-ent.co www.v-ent.co api.v-ent.co;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- frontend --
server {
    listen 443 ssl http2;
    server_name v-ent.co www.v-ent.co;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    limit_conn conn 40;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js fingerprints these filenames, so they can be cached forever. This
    # is what keeps a Lagos visitor off the 150ms round trip on repeat views.
    location /_next/static/ {
        alias /srv/vent/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # While the app is restarting, say so. The default is nginx's own 502, which
    # tells somebody nothing and looks like the site is gone rather than busy.
    # The page is self-contained because everything it could otherwise link to
    # is served by the process that is currently down.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /srv/vent;
        internal;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A restart takes a couple of seconds. Waiting through it beats showing
        # the maintenance page to somebody who would have been served anyway.
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# --------------------------------------------------------------------- api --
server {
    listen 443 ssl http2;
    server_name api.v-ent.co;

    client_max_body_size 12M;      # KYC photos, event banners
    limit_conn conn 40;

    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /srv/vent/static/;
        expires 30d;
    }

    # PUBLIC uploads only: avatars, banners, logos, product shots.
    # Identity documents are NOT here - see /private/ below.
    location /media/ {
        alias /srv/vent/media/;
        expires 7d;
    }

    # KYC identity documents. `internal` means nginx refuses to serve this
    # location to a client directly; it is only reachable when Django answers a
    # request with an X-Accel-Redirect header pointing into it, which it only
    # does after checking the caller owns the document or may review KYC.
    location /private/ {
        internal;
        alias /srv/vent/private/;
    }

    # Credential endpoints get a much tighter bucket than the rest of the API.
    # The admin console. Authenticated, and it fetches several endpoints per
    # page, so it gets its own generous zone. See the note by the zone above
    # for what happened when it shared the brute-force one.
    location ~ ^/auth/admin {
        limit_req zone=admin burst=60 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Guessing a password. This is the one that should be tight.
    location ~ ^/auth/(login|signup|forgot-password) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
