# The two Next instances, restarted one at a time so a deploy never puts a page
# in front of anybody. See deploy/systemd/vent-web@.service.
#
# nginx open source has no active health checking, and it does not need one
# here: max_fails=1 fail_timeout=5s takes an instance out of rotation the
# moment it refuses a connection, and proxy_next_upstream below RETRIES that
# same request on the other instance, so the person waiting never sees the
# failure that took it out.
upstream vent_web {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
    keepalive 32;
}

server {
    server_name app.v-ent.co;

    # The platform answers on the apex now. This host stays alive only to carry
    # the links already in the world - the claim emails mailed on 18 August
    # point here - so the redirect keeps the path and lands people on the same
    # page they were promised.
    return 301 https://v-ent.co$request_uri;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.v-ent.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.v-ent.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name api.v-ent.co;

    client_max_body_size 12M;
    limit_conn conn 40;
    add_header X-Content-Type-Options nosniff always;

    location /static/ { alias /srv/vent/static/; expires 30d; }

    # Public uploads only. Identity documents live under /private/ below.
    location /media/  { alias /srv/vent/media/;  expires 7d; }

    # KYC documents. `internal` means nginx will not serve this to a client
    # directly - only Django can release a file, by answering with an
    # X-Accel-Redirect after checking who is asking.
    location /private/ { internal; alias /srv/vent/private/; }

    # The admin console. Authenticated, and it fetches several endpoints per
    # page, so it gets its own generous zone. It used to be caught by the
    # brute-force regex below and throttled at 5 requests a minute, which made
    # the console unusable and reported itself to the operator as a network
    # failure, because a limiter rejection carries no CORS headers.
    location ~ ^/auth/admin {
        limit_req zone=admin burst=60 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Guessing a password. This is the one that should be tight.
    location ~ ^/auth/(login|signup|forgot-password) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The overlay feeds and the studio feed: public JSON polled by browser
    # sources, several per venue from one address. Their own zone, and a one
    # second microcache so a burst costs one upstream hit. `updating` serves
    # the last copy while a fresh one is fetched, so a poll never waits.
    location ~ ^/(tournament|event)/[^/]+/overlay-feed/$ {
        limit_req zone=feed burst=120 nodelay;
        proxy_cache feed_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/studio/[^/]+/feed/$ {
        limit_req zone=feed burst=120 nodelay;
        proxy_cache feed_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The overlay page itself: the uploaded file with the runtime injected.
    # Not cached (a rotate must take effect at once), but on the feed lane so
    # OBS reloading a source does not spend the organiser's api budget.
    location ~ "^/overlay/([^/]+/){0,2}[^/]+/$" {
        limit_req zone=feed burst=120 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A studio asset is a clip. The rest of the API keeps its 12 MB.
    location ~ ^/(tournament|event)/[^/]+/studio/assets/ {
        client_max_body_size 220M;
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://unix:/run/vent/api.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.v-ent.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.v-ent.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = app.v-ent.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name app.v-ent.co;
    return 404; # managed by Certbot


}

server {
    if ($host = api.v-ent.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name api.v-ent.co;
    return 404; # managed by Certbot


}
# The apex. Added 2026-08-25 when v-ent.co moved off the Vercel waitlist onto
# this box. Plain :80 for now - certbot rewrites this block once the DNS
# records point here and the challenge can pass.
server {
    server_name v-ent.co;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    limit_conn conn 40;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The written page, for the whole deploy rather than for the seconds the
    # port is dead. deploy.sh creates the flag before it touches anything and
    # removes it when the services are back.
    #
    # 500 is deliberately not mapped here: this page says a new version is
    # going out, which for a genuine fault is a lie, and a fault that presents
    # as planned maintenance is a fault nobody reports.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /srv/vent;
        internal;
        add_header Cache-Control "no-store" always;
    }

    location /_next/static/ {
        alias /srv/vent/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # Inside `location /`, not at server level: at server level this also
        # matched nginx's own internal request for /maintenance.html, so the
        # error page returned 503 to itself and nginx served its built-in page
        # instead. The symptom was a bare "503 Service Temporarily Unavailable"
        # while the written page sat on disk being ignored.
        if (-f /srv/vent/maintenance.on) {
            return 503;
        }

        proxy_pass http://vent_web;
        # A request that lands on the instance being restarted is retried on
        # the other one rather than failed. This is what makes the restart
        # invisible rather than merely brief.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v-ent.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v-ent.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.v-ent.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = v-ent.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name v-ent.co www.v-ent.co;
    return 404; # managed by Certbot




}
# www exists to hand people to the apex, nothing else. One canonical host means
# one set of cookies and one address in search results.
server {
    listen 443 ssl;
    server_name www.v-ent.co;

    ssl_certificate /etc/letsencrypt/live/v-ent.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v-ent.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://v-ent.co$request_uri;
}
