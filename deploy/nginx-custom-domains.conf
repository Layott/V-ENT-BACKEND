# Organisers' own addresses (P8c). Installed as /etc/nginx/sites-enabled/vent-custom,
# beside Certbot's own `vent` file, which this never touches.
#
# Port 80 for any name nginx does not otherwise know: answers the certificate
# challenge from the webroot custom-domains.sh gives certbot, and sends every
# other request to https on the same name. The 443 blocks for the names V-ENT
# has made live are written into /etc/nginx/vent-custom/ by that script.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

include /etc/nginx/vent-custom/*.conf;
