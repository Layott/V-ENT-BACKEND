# Per-IP limits. There is no CDN in front of this box, so nginx is the only
# thing between the internet and the app.
# The box's own addresses are not limited by the per-IP zones below.
#
# The Next server renders every record page by calling this API through
# nginx, and NextAuth signs people in by calling /auth/login/ from the same
# server, so to nginx all of it is ONE client: this box. On 16 October 2026
# 170 of the recent 429s were the box itself (inbox 461): past 120 server
# renders a minute, site-wide, a page's metadata came back "unavailable" and
# the page was served with noindex, to Googlebot as much as anybody; and the
# auth zone held every sign-in on the site to 5 a minute between them.
#
# Per-person limits still apply: NextAuth forwards the real client in
# X-Forwarded-For and vent_auth/throttle.py counts each one (login 20 a
# minute), and anybody calling the API directly is still held here by their
# own address. An empty key is not counted by limit_req.
# (/etc/nginx/conf.d/vent-limits.conf on the box is this file.)
geo $vent_self {
    default                              0;
    127.0.0.1                            1;
    ::1                                  1;
    162.35.101.16                        1;
    2604:a00:101:24:216:3eff:fe36:5cf2   1;
}
map $vent_self $vent_client {
    1        "";
    default  $binary_remote_addr;
}

limit_req_zone  $vent_client zone=auth:10m rate=5r/m;
limit_req_zone  $vent_client zone=api:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# The admin console, which is NOT a login form.
#
# `/auth/admin/...` used to fall into the `auth` zone above, because the
# location regex read `^/auth/(login|signup|forgot-password|admin)`. That zone
# is 5 requests a minute, which is right for somebody guessing a password and
# absurd for a console whose dashboard alone fetches metrics, charts and
# recent activity on every page load. The console tripped the limiter within
# seconds of opening, nginx refused the rest, and because a limiter rejection
# carries no CORS headers the browser reported it to the operator as "could
# not reach the server".
#
# Still limited, because it sits on the open internet and every request behind
# it is authenticated anyway: generous enough to work, small enough to notice.
limit_req_zone  $binary_remote_addr zone=admin:10m rate=300r/m;

# 429 rather than the default 503. A throttle is the client being asked to slow
# down, not the server being broken, and the two are read very differently by
# whoever is looking at it.
limit_req_status 429;

# The overlay and studio feeds. Public, polled by browser sources in OBS or
# vMix, several per venue from one address. 3 September 2026: one overlay in
# OBS asked twenty-five times a second and the organiser's console was refused
# for a minute. This zone is generous and the JSON feeds are microcached below,
# so a burst costs one upstream hit and never touches the api zone.
limit_req_zone  $binary_remote_addr zone=feed:10m rate=600r/m;

# Embeds (P8, inbox 480): /embed/... pages that other websites hold in a frame.
# Public; each viewer loads the page once and refreshes it every half minute,
# slowing to two. Their own zone, so a busy organiser's site never spends the
# api or feed allowance of anybody else; generous, because a venue on one
# address can have many screens showing the same widget. Keyed on the visitor:
# the box itself never asks nginx for an embed (Next renders it in place).
limit_req_zone  $binary_remote_addr zone=embed:10m rate=300r/m;
proxy_cache_path /var/cache/nginx/feed levels=1:2 keys_zone=feed_cache:10m
                 max_size=50m inactive=30s use_temp_path=off;
