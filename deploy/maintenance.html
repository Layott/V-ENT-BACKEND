<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>V-ENT is updating</title>
<!--
  The page nginx serves while a deploy is running.

  CEO, 7 September 2026, after seeing the old one: "Use the proper logo, then
  dont put too much details, just that the site is being updated and apologize
  for it."

  The old version drew its own triangle instead of the V-ENT mark, and then
  explained wallet balances, ticket codes and form submissions in three boxes.
  Somebody who has been interrupted for under a minute does not want a briefing;
  they want to know it is not their fault and that it will be over shortly.

  Standalone by necessity as well as by rule: it is served when the app is not
  running, so it cannot reference anything the app serves. The mark is the real
  logo_mark_red.svg, inlined.
-->
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #131316;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card { max-width: 30rem; text-align: center; }
  .mark { display: block; margin: 0 auto 1.75rem; }
  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 0.85rem;
  }
  p {
    margin: 0;
    font-size: 1rem;
    line-height: 1.65;
    color: rgba(255, 255, 255, 0.62);
  }
  .back { margin-top: 1.5rem; font-size: 0.88rem; color: rgba(255,255,255,0.38); }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" width="52" height="54" id="ventmark" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 80.02 83.02"><defs><style>.cls-1{fill:url(#vg);}.cls-2{fill:url(#vg-2);}</style><linearGradient id="vg" y1="29.05" x2="56.04" y2="29.05" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e30613"/><stop offset="0.48" stop-color="#e30613"/><stop offset="1" stop-color="#be1622"/></linearGradient><linearGradient id="vg-2" x1="32.34" y1="41.51" x2="80.02" y2="41.51" xlink:href="#vg"/></defs><path class="cls-1" d="M0,.15H56C53.56,5.2,51.28,10,48.81,14.68c-.28.53-1.62.68-2.47.69-7,.05-14.06,0-21.67,0,1.27,2.82,2.31,5.27,3.46,7.67,2.35,4.9,4.71,9.8,7.18,14.64a5.22,5.22,0,0,1,0,5.48c-2.56,4.66-4.81,9.48-7.45,14.75Z"/><path class="cls-2" d="M80,.05C66.63,27.77,53.46,55.05,40,83c-2.06-4.26-3.64-8.09-5.71-11.63-2.44-4.19-2.6-7.75-.17-12.31,6.27-11.81,11.82-24,17.67-36,3.39-7,6.84-13.95,10.16-21A3.16,3.16,0,0,1,65.35,0C70,.14,74.73.05,80,.05Z"/></svg>
    <h1>V-ENT is updating</h1>
    <p>Sorry for the interruption. We are putting out a new version and it takes
       about a minute.</p>
    <p class="back">This page takes you back on its own.</p>
  </main>
  <script>
    // Ask for the real site, and go the moment it answers. No countdown and no
    // button: a person watching a timer is a person being made to wait, and a
    // button that does nothing for fifty seconds is worse than no button.
    setInterval(function () {
      fetch(location.href, { method: 'HEAD', cache: 'no-store' })
        .then(function (r) { if (r.ok) location.reload(); })
        .catch(function () {});
    }, 3000);
  </script>
</body>
</html>
